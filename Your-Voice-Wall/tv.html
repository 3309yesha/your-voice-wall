<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Voice Wall | Live Carnival TV</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at 15% 15%, #34204f, transparent 35%),
                radial-gradient(circle at 85% 80%, #182e54, transparent 35%),
                #101225;
            overflow: hidden;
        }

        header {
            padding: 20px 4% 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .brand h1 {
            font-size: clamp(25px, 3vw, 42px);
            color: #ff83c0;
        }

        .brand p {
            color: #c8c9df;
            margin-top: 8px;
        }

        .school-name {
            color: #ffe783 !important;
            font-size: clamp(13px, 1.5vw, 20px);
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 12px;
            text-shadow: 0 0 15px rgba(255, 231, 131, 0.3);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #75efb3;
            font-weight: bold;
        }

        .live-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #75efb3;
            box-shadow: 0 0 15px #75efb3;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.35; }
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 4% 12px;
        }

        .count {
            font-size: 19px;
            color: #ffe783;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            border: none;
            padding: 12px 19px;
            border-radius: 25px;
            background: linear-gradient(135deg, #ff4fa3, #a66cff);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .page-indicator {
            color: #c8c9df;
            font-size: 14px;
        }

        .wall {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding: 10px 4% 15px;
            height: calc(100vh - 190px);
            min-height: 300px;
            overflow: hidden;
        }

        .wall.page-change {
            animation: pageChange 0.65s ease;
        }

        @keyframes pageChange {
            from {
                opacity: 0.25;
                transform: translateX(35px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .note {
            min-height: 0;
            height: 100%;
            padding: 20px 16px;
            color: #292337;
            border-radius: 5px;
            box-shadow: 0 12px 25px #0005;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            overflow: hidden;
            overflow-wrap: anywhere;
            animation: appear 0.6s ease both;
        }

        .note:nth-child(even) {
            transform: rotate(1deg);
        }

        .note:nth-child(odd) {
            transform: rotate(-1deg);
        }

        .note.pink {
            background: linear-gradient(145deg, #ffb2d9, #ff83bd);
        }

        .note.yellow {
            background: linear-gradient(145deg, #fff1a7, #ffdf68);
        }

        .note.blue {
            background: linear-gradient(145deg, #b2f1fa, #79dced);
        }

        .note.purple {
            background: linear-gradient(145deg, #ddc8ff, #b993f7);
        }

        .note p {
            line-height: 1.5;
            font-size: clamp(14px, 1.1vw, 19px);
        }

        .note .stars {
            font-size: 15px;
            flex-shrink: 0;
        }

        .note img {
            width: 100%;
            max-height: 115px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #ffffffaa;
        }

        /* Animation for newly approved reviews */
        .note.new-note {
            animation: newNote 1.1s ease both;
            box-shadow:
                0 0 12px #fff,
                0 0 25px #ff83c0,
                0 12px 25px #0005;
            border: 3px solid white;
        }

        @keyframes newNote {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-8deg);
            }
            65% {
                opacity: 1;
                transform: scale(1.08) rotate(2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.9);
            }
            to {
                opacity: 1;
            }
        }

        .empty {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #d4d5e8;
            font-size: 24px;
        }

        footer {
            text-align: center;
            padding: 8px 15px;
            color: #c4c5d9;
            font-size: 13px;
        }

        @media (max-width: 1200px) {
            .wall {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .wall {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                height: calc(100vh - 190px);
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .top-bar {
                justify-content: center;
            }

            .wall {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                padding: 10px;
                height: calc(100vh - 220px);
            }

            .note {
                padding: 12px 8px;
            }

            .note p {
                font-size: 13px;
            }

            .note img {
                max-height: 75px;
            }
        }

        @media (max-width: 360px) {
            .wall {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 1600px) {
            .wall {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }

            .note {
                padding: 25px 20px;
            }

            .note img {
                max-height: 145px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <h1>💬 Your Voice Wall</h1>
            <p class="school-name">KAUSHALAM E-TECHNO INTERNATIONAL SCHOOL</p>
            <p>🎉 SCHOOL CARNIVAL 2026 — EVERY VOICE MATTERS!</p>
        </div>

        <div class="live-status">
            <span class="live-dot"></span>
            LIVE CARNIVAL WALL
        </div>
    </header>

    <div class="top-bar">
        <div class="count">
            💌 <span id="reviewCount">0</span> Happy Voices
        </div>

        <div class="controls">
            <span class="page-indicator" id="pageIndicator">Page 1</span>
            <button id="fullscreenButton">⛶ Full Screen</button>
        </div>
    </div>

    <main>
        <section id="reviewWall" class="wall">
            <div class="empty">Loading happy memories... 💖</div>
        </section>
    </main>

    <footer>
        Made with ❤️ for School Carnival 2026
    </footer>

    <script>
        const reviewWall = document.getElementById("reviewWall");
        const reviewCount = document.getElementById("reviewCount");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const pageIndicator = document.getElementById("pageIndicator");

        const allowedColours = ["pink", "yellow", "blue", "purple"];

        let allReviews = [];
        let knownReviewIds = new Set();
        let newReviewIds = new Set();


        // Work out how many notes fit on the screen.
        function getNotesPerPage() {
            const width = window.innerWidth;
            let columns;

            if (width <= 360) {
                columns = 1;
            } else if (width <= 600) {
                columns = 2;
            } else if (width <= 850) {
                columns = 3;
            } else if (width <= 1200) {
                columns = 4;
            } else if (width >= 1600) {
                columns = 6;
            } else {
                columns = 5;
            }

            return columns * 2;
        }

       function renderReviews(animatePage = false) {
    const notesPerPage = getNotesPerPage();

    // Always display only the newest approved reviews.
    const visibleReviews = allReviews.slice(0, notesPerPage);

    reviewWall.replaceChildren();

    if (animatePage) {
        reviewWall.classList.remove("page-change");
        void reviewWall.offsetWidth;
        reviewWall.classList.add("page-change");
    }

    pageIndicator.textContent = "Latest Reviews";

    if (allReviews.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
            "Be the first to share your carnival memories! 💖";
        reviewWall.appendChild(empty);
        return;
    }

    visibleReviews.forEach((review, index) => {
        const card = document.createElement("article");

        const colour = allowedColours.includes(review.colour)
            ? review.colour
            : "yellow";

        card.className = "note " + colour;

        if (newReviewIds.has(review.id)) {
            card.classList.add("new-note");
        } else {
            card.style.animationDelay = `${index * 0.06}s`;
        }

        const message = document.createElement("p");
        message.textContent = review.review_text || "";

        const reaction = document.createElement("p");
        reaction.textContent = review.reaction || "";

        const stars = document.createElement("p");
        stars.className = "stars";
        stars.textContent =
            "⭐".repeat(
                Math.max(0, Math.min(5, Number(review.rating) || 0))
            );

        card.append(message, reaction, stars);

        if (review.photo_url) {
            const image = document.createElement("img");
            image.src = review.photo_url;
            image.alt = "Carnival memory";
            card.appendChild(image);
        }

        reviewWall.appendChild(card);
    });

    newReviewIds.clear();
}
        async function loadApprovedReviews() {
            try {
                const { data, error } = await supabaseClient
                    .from("reviews")
                    .select(
                        "id, review_text, colour, reaction, rating, photo_url, created_at"
                    )
                    .eq("status", "approved")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                const latestIds = new Set(data.map(review => review.id));

                // Find reviews that have appeared since the last load.
                const newlyApproved = data.filter(
                    review => !knownReviewIds.has(review.id)
                );

                if (newlyApproved.length > 0 && knownReviewIds.size > 0) {
                    newlyApproved.forEach(review => {
                        newReviewIds.add(review.id);
                    });

                    // Show the newest approved notes immediately.
                    currentPage = 0;
                }

                knownReviewIds = latestIds;
                allReviews = data;

                reviewCount.textContent = data.length;

                renderReviews(newlyApproved.length > 0);

                console.log("Live wall updated:", data.length);

            } catch (error) {
                console.error("Live wall error:", error);
            }
        }

        // Load reviews when the TV page opens.
        loadApprovedReviews();

        // Listen for new approvals and other review changes.
        const tvChannel = supabaseClient
            .channel("carnival-tv-live")
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "reviews"
                },
                () => {
                    console.log("Database update received!");
                    loadApprovedReviews();
                }
            )
            .subscribe(status => {
                console.log("TV realtime status:", status);
            });

        

        // Re-render if the TV screen size changes.
        window.addEventListener("resize", () => {
            renderReviews();
        });

        // Full-screen button.
        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen error:", error);
            }
        });

        document.addEventListener("fullscreenchange", () => {
            fullscreenButton.textContent =
                document.fullscreenElement
                    ? "✕ Exit Full Screen"
                    : "⛶ Full Screen";
        });
    </script>

</body>
</html>
