<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Voice Wall | Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="admin-container">

        <header class="admin-header">
            <h2>💬 Your Voice Wall</h2>
            <span>Admin Panel</span>
        </header>

        <main id="loginSection" class="login-box">
            <h1>Welcome Back 👋</h1>
            <p>Sign in to manage carnival reviews.</p>

            <form id="loginForm">
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Admin email"
                    required
                >

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login to Dashboard</button>
            </form>

            <p id="loginMessage"></p>
        </main>

        <main id="dashboardSection" hidden>

            <div class="dashboard-heading">
                <div>
                    <h1>Admin Dashboard</h1>
                    <p>Manage your carnival reviews.</p>
                </div>

                <button id="logoutButton" class="logout-button">
                    Logout
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span>Total Reviews</span>
                    <h2 id="totalCount">0</h2>
                </div>

                <div class="stat-card">
                    <span>Pending</span>
                    <h2 id="pendingCount">0</h2>
                </div>

                <div class="stat-card">
                    <span>Approved</span>
                    <h2 id="approvedCount">0</h2>
                </div>

                <div class="stat-card">
                    <span>Rejected</span>
                    <h2 id="rejectedCount">0</h2>
                </div>
            </div>

            <h2>Review Management</h2>

            <div class="filter-buttons">
                <button data-filter="all">All</button>
                <button data-filter="pending">Pending</button>
                <button data-filter="approved">Approved</button>
                <button data-filter="rejected">Rejected</button>
            </div>

            <div id="reviewList"></div>

            <p id="dashboardMessage"></p>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>

</body>
</html>
